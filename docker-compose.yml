services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_HOST: postgres
      CACHE_ADDRESS: redis:6379
    depends_on: [postgres, redis]

  worker:
    build: .
    command: ./worker
    environment:
      DB_HOST: postgres
      CACHE_ADDRESS: redis:6379
    depends_on: [postgres, redis]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ms-monitoring-qa-be-local
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

volumes:
  pgdata:
  redisdata:
